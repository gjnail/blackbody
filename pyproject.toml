[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blackbody"
version = "1.0.0"
description = "GPU fire, smoke and liquid simulation for compositing into live-action footage"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "numpy>=1.26",
    "wgpu>=0.32,<0.33",
    "PySide6>=6.7",
    "av>=14",
    "OpenEXR>=3.3",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyinstaller>=6.10"]

[project.scripts]
blackbody = "blackbody.cli:main"

[project.gui-scripts]
blackbody-app = "blackbody.ui.app:run"

[tool.setuptools.packages.find]
include = ["blackbody*"]

[tool.setuptools.package-data]
blackbody = ["engine/wgsl/*.wgsl", "assets/presets/*.png", "assets/meshes/*.obj"]
