name: CI

# GitHub's machines have no GPU, so this checks what runs without one on Windows, macOS and Linux: the
# dependencies install, every module compiles, the command line answers, every test that needs no GPU passes
# (conftest.py marks the ones that use the engine `gpu`), and the website builds. Run the full test suite
# (pytest -q) on a machine with a GPU before a pull request.

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest markdown==3.9
      - name: Compile every module
        run: python -m compileall -q blackbody tools tests
      - name: Command line
        shell: bash
        run: |
          python -m blackbody --version
          python -m blackbody presets > presets.txt
          test "$(grep -c . presets.txt)" -eq "$(python -c 'from blackbody.scene import presets; print(len(presets.ORDER))')"
          python -m blackbody settings > settings.txt
          grep -q "motion.buoyancy" settings.txt
      - name: Qt's system libraries
        # (tests/test_text.py, one of tests/test_clouds.py and the window's tests in tests/ui/ use PySide6, whose Qt needs
        # these: without one, importing it fails and pytest stops while it collects the tests)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libopengl0 libxkbcommon0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Tests that need no GPU
        env:
          BLACKBODY_ALLOW_NO_GPU: "1"   # (the tests that use the engine are deselected; any that still asks for it skips, not errors)
          QT_QPA_PLATFORM: offscreen
        run: python -m pytest -q -m "not gpu"
      - name: Website builds
        if: runner.os == 'Linux'
        run: python tools/build_site.py
