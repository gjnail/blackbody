[pytest]
markers =
    slow: long by design (every preset simulated, the command-line renderer); runs only when asked for: pytest -m slow
    gpu: needs a GPU (set by conftest.py on every test that uses the engine); CI runs pytest -m "not gpu"
    quick: the everyday tier (set by conftest.py): needs no GPU, or took under 10 s when it last ran here
    timeout(seconds): this test's own time limit, in place of the timeout below
addopts = -m "not slow"
# seconds a test may run (shader compiles aside) before the run stops with every thread's stack; 0 for no limit
timeout = 600
testpaths = tests
